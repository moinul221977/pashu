<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pashu Eta - পশুর হাট</title>
<style>
body{margin:0;background:#f1f5f9;font-family:system-ui;padding-bottom:400px}
.top{max-width:520px;margin:auto;background:#fff;text-align:center;padding:16px}
.top h1{color:#15803d;margin:0;font-size:26px}
.card{max-width:520px;margin:10px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px #0001}
.card img{width:100%;display:block}
.box{max-width:520px;margin:12px auto;background:#fff;border-radius:16px;padding:18px}
label{font-weight:600;display:block;margin:6px 0}
input,select{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:18px;box-sizing:border-box;margin-bottom:12px}
button{width:100%;padding:14px;background:#16a34a;color:#fff;border:0;border-radius:10px;font-size:18px;font-weight:bold}
#result{margin-top:14px;padding:14px;background:#dcfce7;border-radius:10px;display:none;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div class="top"><h1>🐄 পশুর হাট - লাইভ গরুর বাজার</h1></div>

<div class="card">
<img src="cow.jpg" alt="ফিতা দিয়ে মাপার নিয়ম">
<div style="padding:10px;text-align:center;font-weight:700">ফিতা দিয়ে মাপার নিয়ম - How to Measure with Tape</div>
<div style="display:flex;gap:8px;justify-content:center;padding:0 10px 12px">
<span style="background:#dbeafe;padding:5px 10px;border-radius:20px;font-size:12px">Step 1: Measure Length</span>
<span style="background:#dcfce7;padding:5px 10px;border-radius:20px;font-size:12px">Step 2: Measure Girth</span>
</div>
</div>

<div class="box">
<h2 id="mt">⚖️ ওজন ক্যালকুলেটর / Weight Calculator</h2>

<label>🌐 ভাষা / Language</label>
<select id="lang" onchange="changeLang()">
<option value="bn">বাংলা</option>
<option value="en">English</option>
</select>

<label id="lb1">📏 দৈর্ঘ্য (L) - ইঞ্চিতে লিখুন</label>
<input type="number" id="L" placeholder="যেমন: 51">

<label id="lb2">⭕ বুকের বেড় (G) - ইঞ্চিতে লিখুন</label>
<input type="number" id="G" placeholder="যেমন: 62">

<p id="f" style="text-align:center;color:#666;font-size:13px">সূত্র: (L x G x G) ÷ 660 = জীবিত ওজন (কেজি)</p>
<button onclick="calc()" id="btn">ওজন দেখুন / Calculate</button>
<div id="result"></div>

<a id="wa" href="https://wa.me/8801773688915" style="display:block;margin-top:14px;padding:13px;background:#25D366;color:#fff;text-align:center;border-radius:10px;text-decoration:none;font-weight:bold">📲 WhatsApp এ রেজাল্ট পাঠান</a>
<div style="text-align:center;color:#666;margin-top:16px;font-size:13px">© 2026 Pashu Eta</div>
</div>

<script>
const T={
bn:{lb1:"📏 দৈর্ঘ্য (L) - ইঞ্চিতে লিখুন",lb2:"⭕ বুকের বেড় (G) - ইঞ্চিতে লিখুন",f:"সূত্র: (L x G x G) ÷ 660 = জীবিত ওজন (কেজি)",b:"ওজন দেখুন / Calculate",w:"📲 WhatsApp এ রেজাল্ট পাঠান",mt:"⚖️ ওজন ক্যালকুলেটর / Weight Calculator",p1:"যেমন: 51",p2:"যেমন: 62"},
en:{lb1:"📏 Length (L) - in inch",lb2:"⭕ Heart Girth (G) - in inch",f:"Formula: (L x G x G) ÷ 660 = Live Weight (Kg)",b:"Calculate Weight",w:"📲 Send Result on WhatsApp",mt:"⚖️ Weight Calculator",p1:"Ex: 51",p2:"Ex: 62"}
};
function changeLang(){
let l=document.getElementById("lang").value;
document.getElementById("lb1").innerText=T[l].lb1;
document.getElementById("lb2").innerText=T[l].lb2;
document.getElementById("f").innerText=T[l].f;
document.getElementById("btn").innerText=T[l].b;
document.getElementById("wa").innerText=T[l].w;
document.getElementById("mt").innerText=T[l].mt;
document.getElementById("L").placeholder=T[l].p1;
document.getElementById("G").placeholder=T[l].p2;
}
function calc(){
let L=document.getElementById("L").value,G=document.getElementById("G").value,r=document.getElementById("result");
if(!L||!G){r.style.display="block";r.innerHTML="সঠিক মাপ দিন / Enter size";return}
let w=(G*G*L)/660,m=w*0.55;
r.innerHTML="✅ জীবিত: "+w.toFixed(1)+" কেজি ("+(w/40).toFixed(2)+" মণ)<br>🥩 মাংস: "+m.toFixed(1)+" কেজি";
r.style.display="block";r.style.marginBottom="30px";
setTimeout(()=>{r.scrollIntoView({behavior:"smooth",block:"center"})},150);
document.activeElement.blur();
}
</script>
</body>
</html>
