<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pashu Eta</title>
</head>
<body style="margin:0;background:#f1f5f9;font-family:sans-serif;padding-bottom:400px">
<div style="max-width:500px;margin:auto;background:#fff;text-align:center;padding:20px">
<h1 style="color:#15803d;margin:0">🐄 পশুর হাট - লাইভ গরুর বাজার</h1>
</div>
<div style="max-width:500px;margin:10px auto;background:#fff;border-radius:16px;padding:16px;text-align:center">
<p><b>📏 ফিতা দিয়ে মাপার নিয়ম</b></p>
<img src="cow.jpg" style="width:100%" onerror="this.style.display='none'">
</div>
<div style="max-width:500px;margin:10px auto;background:#fff;border-radius:16px;padding:18px">
<h2>⚖️ ওজন ক্যালকুলেটর</h2>
<input id="L" type="number" placeholder="দৈর্ঘ্য L - 51" style="width:100%;padding:14px;margin:6px 0">
<input id="G" type="number" placeholder="বুকের বেড় G - 62" style="width:100%;padding:14px;margin:6px 0">
<button onclick="calc()" style="width:100%;padding:14px;background:green;color:white;border:0;border-radius:10px">ওজন দেখুন</button>
<div id="r" style="display:none;margin-top:10px;padding:10px;background:#dcfce7;text-align:center;font-weight:bold"></div>
</div>
<script>
function calc(){
var L=document.getElementById('L').value;
var G=document.getElementById('G').value;
var r=document.getElementById('r');
if(!L||!G){r.style.display='block';r.innerHTML='মাপ দিন';return}
var w=(G*G*L)/660;
r.innerHTML='ওজন: '+w.toFixed(1)+' কেজি';
r.style.display='block';
}
</script>
</body>
</html>
