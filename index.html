<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>গরুর ওজন ক্যালকুলেটর</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; }
        .calculator { max-width: 400px; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; background: #27ae60; color: white; border: none; padding: 10px; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #219653; }
        .result { margin-top: 20px; text-align: center; font-size: 18px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div class="calculator">
    <h2>ওজন ক্যালকুলেটর</h2>
    <div class="form-group">
        <label for="length">দৈর্ঘ্য (Length) - ইঞ্চি</label>
        <input type="number" id="length" placeholder="ইঞ্চিতে লিখুন">
    </div>
    <div class="form-group">
        <label for="girth">বুকের বেড় (Cirth) - ইঞ্চি</label>
        <input type="number" id="girth" placeholder="ইঞ্চিতে লিখুন">
    </div>
    <button onclick="calculateWeight()">ওজন হিসাব করুন</button>
    <div class="result" id="resultText"></div>
</div>

<script>
    function calculateWeight() {
        let l = parseFloat(document.getElementById('length').value);
        let c = parseFloat(document.getElementById('girth').value);
        
        if (isNaN(l) || isNaN(c) || l <= 0 || c <= 0) {
            document.getElementById('resultText').innerHTML = "দয়া করে সঠিক মাপ লিখুন!";
            return;
        }
        
        // শেফার সূত্র অনুযায়ী কেজিতে রূপান্তর (আনুমানিক)
        let weightKg = (l * c * c) / 660; 
        let weightMon = weightKg / 40; // ৪০ কেজিতে ১ মণ
        
        document.getElementById('resultText').innerHTML = 
            `আনুমানিক ওজন: ${weightKg.toFixed(2)} কেজি<br>(${weightMon.toFixed(2)} মণ)`;
    }
</script>

</body>
</html>
