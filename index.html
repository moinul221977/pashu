
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pashu Eta - Cow Weight Calculator | Live Weight, Meat kg, Mon</title>
<meta name="description" content="Cow, Goat, Buffalo weight calculator - Calculate live weight, meat in kg and mon. গরুর ওজন ক্যালকুলেটর">
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f7f2;font-family:Arial,sans-serif}
.box{max-width:520px;margin:0 auto;background:#fff;min-height:100vh}
.top-img{width:100%;display:block}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0a8a2a;color:#fff}
.lang-btn{background:#fff;color:#0a8a2a;border:none;padding:6px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
.content{padding:16px}
h2{text-align:center;color:#0a8a2a;margin:8px 0}
label{font-weight:bold;display:block;margin:12px 0 6px}
input,select{width:100%;padding:14px;border:1px solid #ccc;border-radius:10px;font-size:16px}
.btn{width:100%;padding:15px;border:none;border-radius:10px;font-weight:bold;font-size:18px;cursor:pointer;margin-top:10px}
.btn-calc{background:#0a8a2a;color:#fff}
.btn-wa{background:#25D366;color:#fff;display:none}
.result{margin-top:15px;background:#e8f5e9;padding:15px;border-radius:12px;display:none;line-height:1.9;font-size:17px;border:1px solid #a5d6a7}
.ad{background:#fffde7;border:1px dashed #f9a825;padding:12px;text-align:center;border-radius:8px;margin:14px 0;font-size:12px;color:#666}
.small{font-size:12px;color:#666;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<img class="top-img" src="cow.jpg" alt="Cow Weight Calculator">
<div class="header">
<span id="logoText">Pashu Eta</span>
<button class="lang-btn" onclick="toggleLang()" id="langBtn">English</button>
</div>

<div class="content">
<h2 id="title">গরুর ওজন ক্যালকুলেটর</h2>

<!-- AD TOP -->
<div class="ad">AD TOP - এখানে AdSense কোড বসান<br>&lt;script adsense...&gt;</div>

<label id="l-animal">পশু নির্বাচন</label>
<select id="animal">
<option value="cow">গরু / Cow</option>
<option value="goat">ছাগল / Goat</option>
<option value="buffalo">মহিষ / Buffalo</option>
</select>

<label id="l-len">দৈর্ঘ্য (ইঞ্চি) - B / Length (inch)</label>
<input id="len" type="number" placeholder="70">

<label id="l-gir">বুকের বেড় (ইঞ্চি) - C / Chest (inch)</label>
<input id="gir" type="number" placeholder="75">

<button class="btn btn-calc" onclick="calc()" id="calcBtn">ওজন হিসাব করুন</button>

<div class="result" id="resBox">
<div id="r1"></div>
<div id="r2"></div>
<div id="r3"></div>
</div>

<button class="btn btn-wa" onclick="shareWA()" id="waBtn">WhatsApp এ শেয়ার করুন</button>

<!-- AD MID -->
<div class="ad">AD MID - এখানে AdSense কোড বসান</div>

<div class="small" id="formula">ফর্মুলা: (বুকের বেড়² × দৈর্ঘ্য) ÷ 660 = জীবিত ওজন</div>

<!-- AD BOTTOM -->
<div class="ad">AD BOTTOM - এখানে AdSense কোড বসান</div>
<div class="small">© pashu-eta.vercel.app - Worldwide Cow Weight Calculator</div>
</div>
</div>

<script>
let isBN = true;
let lastResult = "";
const dict = {
 bn: {
  title:"গরুর ওজন ক্যালকুলেটর", calcBtn:"ওজন হিসাব করুন", animal:"পশু নির্বাচন", len:"দৈর্ঘ্য (ইঞ্চি) - B", gir:"বুকের বেড় (ইঞ্চি) - C", formula:"ফর্মুলা: (বুকের বেড়² × দৈর্ঘ্য) ÷ 660 = জীবিত ওজন", wa:"WhatsApp এ শেয়ার করুন", logo:"Pashu Eta", langBtn:"English", live:"জীবিত ওজন", meat:"মাংস", mon:"মন"
 },
 en: {
  title:"Cow Weight Calculator", calcBtn:"Calculate Weight", animal:"Select Animal", len:"Length (inch) - B", gir:"Chest Girth (inch) - C", formula:"Formula: (Chest² × Length) ÷ 660 = Live Weight", wa:"Share on WhatsApp", logo:"Pashu Eta", langBtn:"বাংলা", live:"Live Weight", meat:"Meat", mon:"Mon (40kg)"
 }
};

function toggleLang(){
 isBN = !isBN;
 let d = isBN ? dict.bn : dict.en;
 document.getElementById('title').innerText = d.title;
 document.getElementById('calcBtn').innerText = d.calcBtn;
 document.getElementById('l-animal').innerText = d.animal;
 document.getElementById('l-len').innerText = d.len;
 document.getElementById('l-gir').innerText = d.gir;
 document.getElementById('formula').innerText = d.formula;
 document.getElementById('waBtn').innerText = d.wa;
 document.getElementById('logoText').innerText = d.logo;
 document.getElementById('langBtn').innerText = d.langBtn;
 if(document.getElementById('resBox').style.display==='block') calc();
}

function calc(){
 let L=parseFloat(document.getElementById('len').value);
 let G=parseFloat(document.getElementById('gir').value);
 if(!L||!G){alert(isBN?'দৈর্ঘ্য ও বুকের বেড় লিখুন':'Enter Length & Chest');return;}
 let live=(G*G*L)/660;
 let meat=live*0.55;
 let mon=meat/40;
 let d = isBN ? dict.bn : dict.en;
 document.getElementById('r1').innerText = `${d.live}: ${live.toFixed(2)} kg`;
 document.getElementById('r2').innerText = `${d.meat}: ${meat.toFixed(2)} kg`;
 document.getElementById('r3').innerText = `${d.mon}: ${mon.toFixed(2)}`;
 document.getElementById('resBox').style.display='block';
 document.getElementById('waBtn').style.display='block';
 lastResult = `${d.live}: ${live.toFixed(2)} kg, ${d.meat}: ${meat.toFixed(2)} kg (${mon.toFixed(2)} Mon) - pashu-eta.vercel.app`;
}

function shareWA(){
 let url = "https://wa.me/?text=" + encodeURIComponent(lastResult);
 window.open(url, '_blank');
}
</script>
</body>
</html>
