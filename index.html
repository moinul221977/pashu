<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pashu Weight Calculator - পশু ওজন ক্যালকুলেটর</title>
<meta name="description" content="গরুর জীবিত ওজন ও মাংসের ওজন মন ও কেজিতে হিসাব করুন">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font-family:system-ui;padding:10px}
.card{max-width:500px;margin:auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.1)}
.top-img{width:100%;height:170px;object-fit:cover}
.content{padding:16px;padding-bottom:120px}
.lang{display:flex;justify-content:flex-end;gap:6px}
.lang button{padding:5px 12px;border-radius:20px;border:1px solid #15803d;background:#fff}
.lang button.active{background:#15803d;color:#fff}
h2{text-align:center;margin:8px 0}
.formula{background:#fef9c3;padding:8px;border-radius:8px;text-align:center;font-weight:bold;font-size:14px}
label{font-weight:bold;display:block;margin:14px 0 6px}
input{width:100%;padding:14px;border:2px solid #15803d;border-radius:10px;font-size:20px}
.btn{width:100%;background:#15803d;color:#fff;border:none;padding:14px;border-radius:10px;font-size:18px;font-weight:bold;margin-top:14px}
.result{margin-top:14px;background:#f0fdf4;border:2px solid #15803d;border-radius:12px;padding:14px;display:none;text-align:center}
.meat-box{background:#fff;padding:10px;border-radius:8px;margin-top:8px;border:1px dashed #16a34a}
.whatsapp{background:#25D366;color:#fff;border:none;padding:12px;border-radius:8px;width:100%;font-weight:bold;margin-top:10px}
.ad-box{background:#f9fafb;text-align:center;padding:8px;font-size:12px;color:#888;border-top:1px solid #eee;margin-top:12px}
.footer{padding:10px;text-align:center;font-size:13px}
.footer a{margin:0 8px;color:#15803d;text-decoration:none}
</style>
</head>
<body>
<div class="card">
<img src="cow-top.jpg" class="top-img" onerror="this.style.display='none'">
<div class="content">
<div class="lang"><button id="bnBtn" class="active" onclick="setLang('bn')">বাংলা</button><button id="enBtn" onclick="setLang('en')">EN</button></div>
<h2 id="title">🐄 পশু ওজন ক্যালকুলেটর</h2>
<div class="formula" id="formula">সূত্র: (দৈর্ঘ্য × বেড় × বেড়) ÷ ৬৬০</div>
<label id="l1">দৈর্ঘ্য (ইঞ্চি)</label>
<input type="number" id="len" placeholder="70" inputmode="numeric">
<label id="l2">বুকের বেড় (ইঞ্চি)</label>
<input type="number" id="girth" placeholder="65" inputmode="numeric">
<button class="btn" id="calcBtn" onclick="calculate()">⚖️ হিসাব করুন</button>

<div class="result" id="resultBox">
<div id="liveLabel" style="color:#666;font-size:14px"></div>
<div id="liveKg" style="font-size:32px;font-weight:bold;color:#15803d"></div>
<div id="liveMon" style="font-size:18px;font-weight:bold"></div>
<div class="meat-box">
<div id="meatLabel">🥩 মাংসের ওজন</div>
<div id="meatKg" style="font-weight:bold;font-size:18px"></div>
<div id="meatMon" style="font-weight:bold;color:#15803d;font-size:20px"></div>
</div>
<button class="whatsapp" id="shareBtn" onclick="shareWA()">WhatsApp এ শেয়ার করুন</button>
</div>

<div class="ad-box">
<p>বিজ্ঞাপন</p>
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXX" data-ad-slot="2222222222" data-ad-format="auto" data-full-width-responsive="true"></ins>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
<p>আপনার খামারের বিজ্ঞাপন এখানে দিতে যোগাযোগ করুন</p>
</div>

<div class="footer">
<a href="about.html">About</a> | <a href="contact.html">Contact</a> | <a href="privacy-policy.html">Privacy</a>
</div>

</div>
</div>
<script>
let lang='bn';
const t={
bn:{title:'🐄 পশু ওজন ক্যালকুলেটর',formula:'সূত্র: (দৈর্ঘ্য × বেড় × বেড়) ÷ ৬৬০',l1:'দৈর্ঘ্য (ইঞ্চি)',l2:'বুকের বেড় (ইঞ্চি)',btn:'⚖️ হিসাব করুন',live:'জীবিত ওজন / Live Weight',meat:'🥩 মাংসের ওজন',share:'📲 WhatsApp এ শেয়ার করুন',alert:'দৈর্ঘ্য ও বেড় লিখুন',mon:'মন'},
en:{title:'🐄 Animal Weight Calculator',formula:'Formula: (L × G × G) ÷ 660',l1:'Length (inch)',l2:'Girth (inch)',btn:'⚖️ Calculate',live:'Live Weight',meat:'🥩 Meat Weight',share:'📲 Share on WhatsApp',alert:'Enter Length & Girth',mon:'Mon'}
};
function setLang(l){lang=l;document.getElementById('bnBtn').classList.toggle('active',l=='bn');document.getElementById('enBtn').classList.toggle('active',l=='en');document.getElementById('title').innerText=t[l].title;document.getElementById('formula').innerText=t[l].formula;document.getElementById('l1').innerText=t[l].l1;document.getElementById('l2').innerText=t[l].l2;document.getElementById('calcBtn').innerText=t[l].btn;document.getElementById('shareBtn').innerText=t[l].share;}
function calculate(){
let L=parseFloat(document.getElementById('len').value),G=parseFloat(document.getElementById('girth').value);
if(!L||!G){alert(t[lang].alert);return;}
let liveKg=(L*G*G)/660, liveMon=liveKg/40, meatKg=liveKg*0.55, meatMon=meatKg/40;
document.getElementById('liveLabel').innerText=t[lang].live;
document.getElementById('liveKg').innerText=liveKg.toFixed(1)+' KG';
document.getElementById('liveMon').innerText=liveMon.toFixed(2)+' '+t[lang].mon;
document.getElementById('meatLabel').innerText=t[lang].meat;
document.getElementById('meatKg').innerText=meatKg.toFixed(1)+' KG';
document.getElementById('meatMon').innerText=meatMon.toFixed(2)+' '+t[lang].mon+' (55%)';
document.getElementById('resultBox').style.display='block';
document.getElementById('resultBox').scrollIntoView({behavior:'smooth'});
}
function shareWA(){let txt=document.getElementById('liveKg').innerText+' | '+document.getElementById('liveMon').innerText+'\n'+document.getElementById('meatKg').innerText+'\nhttps://moinul221977.github.io/pashu/';window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');}
</script>
</body>
</html>
