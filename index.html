<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pashu Calculator</title>
<style>
html{scroll-behavior:smooth}
body{font-family:system-ui,sans-serif;background:#f6f7f9;margin:0;padding:10px;padding-bottom:120px}
.card{max-width:500px;margin:10px auto;background:#fff;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,.1);padding:20px}
.header{display:flex;justify-content:space-between;align-items:center}
.lang-btn{background:#eef2ff;border:1px solid #c7d2fe;padding:8px 14px;border-radius:20px;font-weight:bold}
.top-img{width:100%;border-radius:12px;margin:12px 0}
h2{text-align:center}
.formula{background:#fef9c3;padding:10px;border-radius:10px;text-align:center;font-weight:bold}
label{font-weight:bold;display:block;margin:14px 0 6px;font-size:17px}
input{width:100%;padding:16px;border:2px solid #15803d;border-radius:12px;font-size:20px;box-sizing:border-box}
input:focus{outline:none;border-color:#0f5a2a;box-shadow:0 0 0 3px #bbf7d0}
.btn{width:100%;background:#15803d;color:#fff;border:none;padding:16px;border-radius:12px;font-size:19px;font-weight:bold;margin-top:18px}
.result{background:#f0fdf4;border:2px solid #15803d;border-radius:12px;padding:15px;margin-top:15px;display:none;text-align:center}
.whatsapp{background:#25D366;color:#fff;border:none;padding:13px;border-radius:10px;width:100%;font-size:17px;font-weight:bold;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<div class="header"><b>🐄 Pashu Calculator</b><button class="lang-btn" onclick="toggleLang()" id="langBtn">English</button></div>
<img src="cow-top.jpg" class="top-img">
<h2 id="title">🐄 পশু ওজন ক্যালকুলেটর</h2>
<div class="formula" id="formula">সূত্র: (দৈর্ঘ্য × বেড় × বেড়) ÷ ৬৬০</div>
<label id="l1">দৈর্ঘ্য (ইঞ্চি) - A থেকে B</label>
<input type="number" id="len" placeholder="যেমন: 70" inputmode="numeric" onfocus="scrollToInput(this)">
<label id="l2">বুকের বেড় (ইঞ্চি) - C</label>
<input type="number" id="girth" placeholder="যেমন: 65" inputmode="numeric" onfocus="scrollToInput(this)">
<button class="btn" onclick="calculate()" id="calcBtn">⚖️ হিসাব করুন</button>
<div class="result" id="resultBox"><div id="resultText"></div><button class="whatsapp" onclick="shareWA()" id="waBtn">📲 WhatsApp এ শেয়ার করুন</button></div>
</div>
<script>
let lang='bn',lastResult='';const t={bn:{title:'🐄 পশু ওজন ক্যালকুলেটর',formula:'সূত্র: (দৈর্ঘ্য × বেড় × বেড়) ÷ ৬৬০',l1:'দৈর্ঘ্য (ইঞ্চি) - A থেকে B',l2:'বুকের বেড় (ইঞ্চি) - C',ph1:'যেমন: 70',ph2:'যেমন: 65',btn:'⚖️ হিসাব করুন',wa:'📲 WhatsApp এ শেয়ার করুন',lang:'English'},en:{title:'🐄 Cattle Weight Calculator',formula:'Formula: (Length × Girth × Girth) ÷ 660',l1:'Length (inch) - A to B',l2:'Chest Girth (inch) - C',ph1:'e.g: 70',ph2:'e.g: 65',btn:'⚖️ Calculate',wa:'📲 Share on WhatsApp',lang:'বাংলা'}};
function scrollToInput(el){setTimeout(()=>{el.scrollIntoView({behavior:'smooth',block:'center'})},300);}
function toggleLang(){lang=lang==='bn'?'en':'bn';const tr=t[lang];document.getElementById('title').innerText=tr.title;document.getElementById('formula').innerText=tr.formula;document.getElementById('l1').innerText=tr.l1;document.getElementById('l2').innerText=tr.l2;document.getElementById('len').placeholder=tr.ph1;document.getElementById('girth').placeholder=tr.ph2;document.getElementById('calcBtn').innerText=tr.btn;document.getElementById('waBtn').innerText=tr.wa;document.getElementById('langBtn').innerText=tr.lang;}
function calculate(){let L=parseFloat(document.getElementById('len').value),G=parseFloat(document.getElementById('girth').value);if(!L||!G){alert('দৈর্ঘ্য ও বেড় লিখুন');return;}let kg=(L*G*G)/660,mon=kg/40,meat=kg*0.55;lastResult=`ওজন: ${kg.toFixed(1)} কেজি (${mon.toFixed(2)} মন) | মাংস: ${meat.toFixed(1)} কেজি`;document.getElementById('resultText').innerHTML=`<b style="font-size:26px;color:#15803d">${kg.toFixed(1)} KG</b><br><b>${mon.toFixed(2)} Mon</b><br>Meat: ${meat.toFixed(1)} KG`;document.getElementById('resultBox').style.display='block';document.getElementById('resultBox').scrollIntoView({behavior:'smooth',block:'center'});}
function shareWA(){let text=`🐄 Pashu Weight: ${lastResult}%0Ahttps://moinul221977.github.io/pashu/`;window.open(`https://wa.me/?text=${text}`,'_blank');}
</script>
</body>
</html>
