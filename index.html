<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pashu Eta - গরুর ওজন ক্যালকুলেটর</title>
<style>
body{font-family:system-ui,sans-serif;background:#f8fafc;margin:0;padding:12px;padding-bottom:400px}
.container{max-width:500px;margin:auto;background:#fff;padding:18px;border-radius:16px;box-shadow:0 2px 10px #0001}
.input-group{margin-bottom:14px}
label{display:block;margin-bottom:6px;font-weight:600}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:18px;box-sizing:border-box}
button{width:100%;padding:14px;background:#16a34a;color:#fff;border:0;border-radius:10px;font-size:18px;font-weight:bold}
.result{margin-top:16px;padding:14px;background:#dcfce7;border-radius:10px;display:none;font-weight:bold;font-size:19px;line-height:1.6}
.footer{text-align:center;margin-top:20px;color:#666;font-size:14px}
.footer a{color:#666;text-decoration:none;margin:0 5px}
</style>
</head>
<body>
<div class="container">
<h2>⚖️ ওজন ক্যালকুলেটর / Weight Calculator</h2>

<label>ভাষা / Language</label>
<select><option>বাংলা</option></select>

<div class="input-group">
<label id="lb1">📏 দৈর্ঘ্য (L) - ইঞ্চিতে লিখুন</label>
<input type="number" id="len" placeholder="যেমন: 51">
</div>

<div class="input-group">
<label id="lb2">⭕ বুকের বেড় (G) - ইঞ্চিতে লিখুন</label>
<input type="number" id="girth" placeholder="যেমন: 62">
</div>

<div class="result" id="result">👉 দৈর্ঘ্য ও বুকের বেড় লিখুন...</div>
<p style="text-align:center;font-size:14px;color:#666">সূত্র: (L x G x G) ÷ 660 = জীবিত ওজন (কেজি)</p>
<button onclick="calculate()">ওজন দেখুন / Calculate</button>

<!-- 3. বিজ্ঞাপন - AdSense টাকা ইনকাম -->
<div style="margin:18px 0;text-align:center">
<!-- এখানে আপনার AdSense কোড বসবে -->
</div>

<!-- 4. লাইভ ভিডিও + WhatsApp + বিজ্ঞাপন সব -->
<a href="https://wa.me/8801773688915" style="display:block;margin-top:16px;padding:12px;background:#25D366;color:#fff;text-align:center;border-radius:10px;text-decoration:none;font-weight:bold">📲 WhatsApp এ রেজাল্ট পাঠান</a>

<div class="footer">
<a href="about.html">About</a> | <a href="privacy.html">Privacy</a> | <a href="contact.html">Contact</a>
<p style="margin-top:10px">© 2026 Pashu Eta - গরুর ওজন মাপার ক্যালকুলেটর</p>
</div>

</div>

<script>
function calculate(){
let l=document.getElementById("len").value
let g=document.getElementById("girth").value
let r=document.getElementById("result")
if(!l||!g){
r.innerHTML="সঠিক মাপ দিন"
r.style.display="block"
return
}
let w=(g*g*l)/660
let m=w*0.55
r.innerHTML="✅ জীবিত ওজন: "+w.toFixed(1)+" কেজি ("+(w/40).toFixed(2)+" মণ)<br>🥩 মাংস হবে: "+m.toFixed(1)+" কেজি ("+(m/40).toFixed(2)+" মণ)"
r.style.display="block"
r.style.marginBottom="20px"
setTimeout(()=>{
r.scrollIntoView({behavior:"smooth",block:"start"})
},100)
document.activeElement.blur()
}
</script>
</body>
</html>
