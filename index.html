button{width:100%;padding:14px;background:#16a34a;color:#fff;border:0;border-radius:10px;font-size:18px;font-weight:800;margin-top:10px}
#result{margin-top:12px;padding:12px;background:#dcfce7;border-radius:10px;display:none;font-weight:bold;text-align:center}
.promo{max-width:500px;margin:10px auto;background:#fffbe6;border:1.5px dashed #f59e0b;border-radius:12px;padding:14px;text-align:center}
