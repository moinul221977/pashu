<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pashu - গরুর ওজন মাপুন</title>
<style>
body{font-family:sans-serif; background:#f0fdf4; margin:0; padding:15px;}
.card{max-width:450px; margin:auto; background:white; border-radius:20px; padding:20px; box-shadow:0 4px 15px rgba(0,0,0,0.1);}
h1{text-align:center; color:#15803d; margin:0;}
h2{color:#15803d; text-align:center;}
img{width:100%; border-radius:12px; border:2px solid #15803d;}
label{font-weight:bold; display:block; margin-top:15px;}
input{width:100%; padding:12px; border-radius:10px; border:2px solid #ddd; margin-top:5px; box-sizing:border-box; font-size:16px;}
button{width:100%; padding:14px; background:#15803d; color:white; border:none; border-radius:12px; font-size:18px; font-weight:bold; margin-top:20px; cursor:pointer;}
.result{background:#dcfce7; padding:15px; border-radius:12px; margin-top:20px; text-align:center; font-size:20px; font-weight:bold; display:none;}
</style>
</head>
<body>
<div class="card">
  <h1>🐄 Pashu Eta</h1>
  <p style="text-align:center; color:#666;">ফিতা দিয়ে গরুর ওজন মাপুন</p>

  <!-- গরুর ছবি -->
  <div style="text-align:center; margin:15px 0;">
    <img src="goru.jpg" alt="গরু মাপার নিয়ম">
    <p style="font-size:14px; font-weight:bold; color:#15803d; margin-top:8px;">👆 ছবির মতো করে L (দৈর্ঘ্য) এবং G (বেড়) মাপুন</p>
  </div>

  <h2>⚖️ ওজন ক্যালকুলেটর</h2>

  <label>দৈর্ঘ্য (L) - ইঞ্চিতে:</label>
  <input type="number" id="length" placeholder="যেমন: 50">

  <label>বেড় / বুকের মাপ (G) - ইঞ্চিতে:</label>
  <input type="number" id="girth" placeholder="যেমন: 60">

  <button onclick="calculate()">ওজন হিসাব করুন</button>

  <div id="result" class="result"></div>
</div>

<script>
function calculate(){
  let L = document.getElementById('length').value;
  let G = document.getElementById('girth').value;
  if(L=='' || G==''){
    alert('দুইটা মাপই দিন');
    return;
  }
  // সঠিক ফর্মুলা
  let liveWeight = (G * G * L) / 660;
  let meatWeight = liveWeight * 0.55;
  
  document.getElementById('result').style.display='block';
  document.getElementById('result').innerHTML = 
    'লাইভ ওজন: ' + liveWeight.toFixed(1) + ' কেজি<br>' +
    'মাংস হবে: ' + meatWeight.toFixed(1) + ' কেজি';
}
</script>
</body>
</html>
