<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Pashu Weight Calculator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font-family:system-ui;padding:10px}
.card{max-width:500px;margin:auto;background:#fff;border-radius:16px;padding:20px;padding-bottom:400px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
.header{display:flex;justify-content:space-between;align-items:center}
.lang-btn{background:#eef2ff;border:1px solid #c7d2fe;padding:8px 14px;border-radius:20px;font-weight:bold}
.top-img{width:100%;border-radius:12px;margin:12px 0;display:block}
h2{text-align:center;margin:8px 0}
.formula{background:#fef9c3;padding:10px;border-radius:10px;text-align:center;font-weight:bold}
label{font-weight:bold;display:block;margin:22px 0 8px;font-size:18px}
input{width:100%;padding:18px;border:3px solid #15803d;border-radius:12px;font-size:22px;background:#fff}
.btn{width:100%;background:#15803d;color:#fff;border:none;padding:18px;border-radius:12px;font-size:20px;font-weight:bold;margin-top:25px}
.result{margin-top:20px;background:#f0fdf4;border:3px solid #15803d;border-radius:12px;padding:18px;display:none;text-align:center}
.whatsapp{background:#25D366;color:#fff;border:none;padding:14px;border-radius:10px;width:100%;font-size:17px;font-weight:bold;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<div class="header"><b>🐄 Pashu</b><button class="lang-btn" onclick="toggleLang()" id="langBtn">English</button></div>
<img src="cow-top.jpg" class="top-img">
<h2 id="title">🐄 পশু ওজন ক্যালকুলেটর</h2>
<div class="formula">সূত্র: (দৈর্ঘ্য × বেড় × বেড়) ÷ ৬৬০</div>

<label id="l1">দৈর্ঘ্য (ইঞ্চি) - A থেকে B</label>
<input type="number" id="len" placeholder="যেমন: 70" onfocus="onFocus(this)">

<label id="l2">বুকের বেড় (ইঞ্চি) - C</label>
<input type="number" id="girth" placeholder="যেমন: 65" onfocus="onFocus(this)">

<button class="btn" onclick="calculate()" id="calcBtn">⚖️ হিসাব করুন</button>

<div class="result" id="resultBox">
<div id="resultText"></div>
<button class="whatsapp" onclick="shareWA()" id="waBtn">📲 WhatsApp এ শেয়ার করুন</button>
</div>
</div>
<script>
function onFocus(el){setTimeout(()=>{el.scrollIntoView({behavior:'smooth',block:'center'});window.scrollBy(0,100);},300);}
let lastText='';
let lang='bn';
const t={bn:{l1:'দৈর্ঘ্য (ইঞ্চি) - A থেকে B',l2:'বুকের বেড় (ইঞ্চি) - C',btn:'⚖️ হিসাব করুন',wa:'📲 WhatsApp এ শেয়ার করুন',lang:'English'},en:{l1:'Length (inch) - A to B',l2:'Girth (inch) - C',btn:'⚖️ Calculate',wa:'📲 Share on WhatsApp',lang:'বাংলা'}};
function toggleLang(){lang=lang==='bn'?'en':'bn';const tr=t[lang];document.getElementById('l1').innerText=tr.l1;document.getElementById('l2').innerText=tr.l2;document.getElementById('calcBtn').innerText=tr.btn;document.getElementById('waBtn').innerText=tr.wa;document.getElementById('langBtn').innerText=tr.lang;}
function calculate(){
let L=parseFloat(document.getElementById('len').value);
let G=parseFloat(document.getElementById('girth').value);
if(!L||!G){alert('দৈর্ঘ্য ও বেড় লিখুন');return;}
let kg=(L*G*G)/660;
let mon=kg/40;
let meat=kg*0.55;
lastText=`জীবিত ওজন: ${kg.toFixed(1)} কেজি, ${mon.toFixed(2)} মন, মাংস: ${meat.toFixed(1)} কেজি`;
document.getElementById('resultText').innerHTML=`
<div style="color:#666;font-size:15px">জীবিত ওজন / Live Weight</div>
<div style="font-size:32px;font-weight:bold;color:#15803d">${kg.toFixed(1)} কেজি</div>
<div style="font-size:20px;font-weight:bold;margin:5px 0">${mon.toFixed(2)} মন</div>
<div style="background:#fff;padding:10px;border-radius:8px;margin-top:10px;font-size:18px">🥩 মাংস (৫৫%): <b>${meat.toFixed(1)} কেজি</b> (${(meat/40).toFixed(2)} মন)</div>
<div style="font-size:13px;color:#666;margin-top:8px">সূত্র: (L×G×G)÷660 | ১ মন=৪০ কেজি</div>
`;
document.getElementById('resultBox').style.display='block';
setTimeout(()=>{document.getElementById('resultBox').scrollIntoView({behavior:'smooth',block:'start'});},300);
}
function shareWA(){let url=`https://wa.me/?text=${encodeURIComponent('🐄 '+lastText+'\nhttps://moinul221977.github.io/pashu/')}`;window.open(url,'_blank');}
</script>
</body>
</html>
