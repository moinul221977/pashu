<style>
body{font-family:Arial; background:#f6f9f6; margin:0; padding:10px}
.container{max-width:520px; margin:auto; background:#fff; border-radius:16px; padding:18px; box-shadow:0 4px 15px rgba(0,0,0,.1)}
.header{display:flex; justify-content:space-between; align-items:center}
.lang-btn{padding:6px 14px; border-radius:20px; border:1px solid #0a8a2a; background:#fff; cursor:pointer; font-weight:bold}

.ad-box{background:#f0f0f0; border:1px dashed #aaa; text-align:center; padding:10px; margin:12px 0; border-radius:8px; font-size:12px; color:#666}
label{display:block; margin:10px 0 5px; font-weight:bold}
select,input{width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; font-size:16px; box-sizing:border-box}
.btn{width:100%; padding:13px; border-radius:10px; border:none; font-size:16px; font-weight:bold; cursor:pointer; margin-top:10px}
.btn-green{background:#0a8a2a; color:#fff}
.btn-blue{background:#0d6efd; color:#fff}
.btn-dark{background:#222; color:#fff}
.result{background:#e8f5e9; border-radius:12px; padding:15px; margin-top:15px; display:none}
.result-item{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #c8e6c9; font-size:17px}
.preview{width:100%; max-height:260px; object-fit:cover; border-radius:10px; margin-top:10px; display:none}
video{width:100%; border-radius:10px; display:none; margin-top:10px; background:#000}
.wa{display:block; background:#25D366; color:#fff; text-align:center; padding:12px; border-radius:10px; text-decoration:none; margin-top:12px; font-weight:bold}

<body>
<div class="container">

<h2 id="title">গরুর ওজন ক্যালকুলেটর - ছবি সহ</h2>

<button class="btn btn-dark" onclick="capturePhoto()" id="btnCap" style="display:none">📸 ছবি তুলুন</button>
<canvas id="canvas" style="display:none"></canvas>

<label id="l_length">দৈর্ঘ্য (ইঞ্চি)</label>
<input type="number" id="length" placeholder="Ex: 70">
<label id="l_girth">বুকের বেড় (ইঞ্চি)</label>
<input type="number" id="girth" placeholder="Ex: 75">

<button class="btn btn-green" onclick="calculate()" id="calcBtn">ওজন হিসাব করুন</button>

<div class="result" id="resultBox">
<div class="result-item"><span id="r_live">জীবিত ওজন</span><span id="liveW">0</span></div>

<a class="wa" id="waBtn" target="_blank" href="#">WhatsApp এ শেয়ার</a>
<button class="btn btn-blue" onclick="goLiveInfo()" id="liveBtn">🔴 Facebook Live এ দেখান</button>
</div>

<div class="ad-box">AD MIDDLE - এখানে AdSense কোড বসবে</div>
<p class="small" id="formula">ছবি দিলে কাস্টমারের বিশ্বাস বাড়বে</p>
<div class="ad-box">AD BOTTOM - এখানে AdSense কোড বসবে</div>
</div>

 document.getElementById('langBtn').innerText=d.btn;

function showPhoto(e){
 let file=e.target.files[0];
 if(file){
  let url=URL.createObjectURL(file);
  let img=document.getElementById('preview');
  img.src=url; img.style.display='block';
 }
}
let stream;
async function openCamera(){
 let video=document.getElementById('video');
 video.style.display='block';
 document.getElementById('btnCap').style.display='block';
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:true});
  video.srcObject=stream;
 }catch(err){ alert('Camera permission needed'); }
}
function capturePhoto(){
 let video=document.getElementById('video');
 let canvas=document.getElementById('canvas');
 canvas.width=video.videoWidth; canvas.height=video.videoHeight;
 canvas.getContext('2d').drawImage(video,0,0);
 let img=document.getElementById('preview');
 img.src=canvas.toDataURL('image/jpeg');
 img.style.display='block';
 if(stream){ stream.getTracks().forEach(t=>t.stop()); }
 video.style.display='none';
 document.getElementById('btnCap').style.display='none';
}
