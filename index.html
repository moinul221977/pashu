<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pashu Eta - Live Cow Market BD</title>
<style>
body{margin:0;background:#f1f5f9;font-family:system-ui;padding-bottom:400px}
.header{max-width:560px;margin:auto;background:#fff;text-align:center;padding:18px;border-radius:0 0 16px 16px}
.header h1{color:#15803d;margin:0;font-size:26px}
.box{max-width:560px;margin:12px auto;background:#fff;border-radius:16px;padding:18px}
.adbox{max-width:560px;margin:12px auto;background:#fff;border-radius:12px;padding:20px;text-align:center;color:#94a3b8;font-size:12px;border:1px dashed #cbd5e1}
label{font-weight:700;display:block;margin:12px 0 6px}
input,select{width:100%;padding:14px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:17px;box-sizing:border-box}
button{width:100%;padding:14px;background:#16a34a;color:#fff;border:0;border-radius:10px;font-size:18px;font-weight:800;margin-top:12px}
#result{margin-top:12px;padding:16px;background:#dcfce7;border:2px solid #16a34a;border-radius:12px;display:none;font-weight:800;text-align:center;line-height:1.8}
.promo{max-width:560px;margin:12px auto;background:#fffbe6;border:1.5px dashed #f59e0b;border-radius:16px;padding:16px;text-align:center}
.wa{display:block;margin-top:12px;padding:14px;background:#25D366;color:#fff;text-align:center;border-radius:12px;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div class="header"><h1>🐄 পশুর হাট - লাইভ গরুর বাজার</h1><p>Pashu Eta - Live Cow Market BD</p></div>
<div class="adbox">Advertisement - AdSense Top</div>
<div class="box">
<h2>⚖️ ওজন ক্যালকুলেটর + মাংসের হিসাব</h2><div style="text-align:center; margin:15px 0;">
  <img src="IMG_20261006_233321.jpg" style="width:100%; border-radius:12px; border:2px solid #15803d;">
  <p style="font-size:14px; font-weight:bold; color:#15803d; margin-top:6px;">👆 ছবির মতো করে ফিতা দিয়ে L এবং G মাপুন</p>
</div>
<select id="lang" onchange="changeLang()"><option value="bn">বাংলা</option><option value="en">English</option></select>
<label id="lb1">📏 দৈর্ঘ্য (L) - ইঞ্চিতে</label>
<input type="number" id="L" placeholder="যেমন: 51" onfocus="this.scrollIntoView({behavior:'smooth',block:'center'})">
<label id="lb2">⭕ বুকের বেড় (G) - ইঞ্চিতে</label>
<input type="number" id="G" placeholder="যেমন: 62" onfocus="this.scrollIntoView({behavior:'smooth',block:'center'})">
<button id="btn" onclick="calc()">ওজন দেখুন / Calculate</button>
<div id="result"></div>
<a id="waBtn" class="wa" href="https://wa.me/8801773688915" target="_blank">📲 WhatsApp এ পাঠান</a>
</div>
<div class="adbox">Advertisement - AdSense Bottom</div>
<div class="promo"><h3>🎉 প্রোমো</h3><p>WhatsApp: 01773688915 - সঠিক মাপে সঠিক দামে গরু কিনুন</p></div>
<script>
var T={
bn:{lb1:"📏 দৈর্ঘ্য (L) - ইঞ্চিতে",lb2:"⭕ বুকের বেড় (G) - ইঞ্চিতে",btn:"ওজন ও মাংস দেখুন",alert:"সঠিক মাপ দিন"},
en:{lb1:"📏 Length (L) - inch",lb2:"⭕ Heart Girth (G) - inch",btn:"Show Weight & Meat",alert:"Enter size"}
};
function changeLang(){
var l=document.getElementById('lang').value;
document.getElementById('lb1').innerText=T[l].lb1;
document.getElementById('lb2').innerText=T[l].lb2;
document.getElementById('btn').innerText=T[l].btn;
}
function calc(){
var L=parseFloat(document.getElementById('L').value);
var G=parseFloat(document.getElementById('G').value);
var r=document.getElementById('result');
var lang=document.getElementById('lang').value;
if(!L||!G){r.style.display='block';r.innerHTML=T[lang].alert;return}
var liveKg=(G*G*L)/660;
var liveMon=liveKg/40;
var meatKg=liveKg*0.55;
var meatMon=meatKg/40;
var meatKg50=liveKg*0.50;
var meatKg60=liveKg*0.60;

if(lang=='bn'){
r.innerHTML=
'✅ <span style="color:#15803d">জীবিত ওজন:</span> '+liveKg.toFixed(1)+' কেজি<br>'+
'⚖️ জীবিত: '+liveMon.toFixed(2)+' মণ<br><hr style="margin:8px 0">'+
'🥩 <span style="color:#b45309">মাংসের ওজন (55%):</span> '+meatKg.toFixed(1)+' কেজি<br>'+
'🥩 মাংস: '+meatMon.toFixed(2)+' মণ<br>'+
'<span style="font-size:12px;color:#64748b">50% হলে: '+meatKg50.toFixed(1)+' কেজি ('+(meatKg50/40).toFixed(2)+' মণ) | 60% হলে: '+meatKg60.toFixed(1)+' কেজি</span>';
}else{
r.innerHTML=
'✅ Live: '+liveKg.toFixed(1)+' Kg ('+liveMon.toFixed(2)+' Mon)<br>'+
'🥩 Meat 55%: '+meatKg.toFixed(1)+' Kg ('+meatMon.toFixed(2)+' Mon)';
}
r.style.display='block';
r.scrollIntoView({behavior:'smooth',block:'center'});
document.getElementById('waBtn').href='https://wa.me/8801773688915?text=Live:'+liveKg.toFixed(1)+'Kg ('+liveMon.toFixed(2)+' Mon) Meat:'+meatKg.toFixed(1)+'Kg ('+meatMon.toFixed(2)+' Mon)';
}
</script>
</body>
</html>
