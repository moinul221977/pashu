<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pashu Eta - পশুর হাট লাইভ গরুর বাজার</title>
<style>
body{margin:0;background:#f1f5f9;font-family:system-ui}
.top{max-width:520px;margin:auto;background:#fff;text-align:center;padding:18px}
.top h1{color:#15803d;margin:0;font-size:28px}
.card{max-width:520px;margin:12px auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px #0001}
.card img{width:100%;display:block}
.box{max-width:520px;margin:12px auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 6px 18px #0001}
label{font-weight:700;display:block;margin:10px 0 6px}
input,select{width:100%;padding:14px;border:1.5px solid #cbd5e1;border-radius:12px;font-size:18px;box-sizing:border-box}
button{width:100%;padding:15px;background:#16a34a;color:#fff;border:0;border-radius:12px;font-size:19px;font-weight:800;margin-top:12px}
#result{margin-top:16px;padding:16px;background:#dcfce7;border-radius:12px;display:none;font-weight:800;font-size:19px;text-align:center;line-height:1.6}
.wa{display:block;margin-top:16px;padding:14px;background:#25D366;color:#fff;text-align:center;border-radius:12px;text-decoration:none;font-weight:800}
.footer{max-width:520px;margin:14px auto;text-align:center;color:#94a3b8;font-size:12px}
</style>
</head>
<body>
<div class="top">
<h1>🐄 পশুর হাট - লাইভ<br>গরুর বাজার</h1>
</div>
<div class="card">
<img src="cow.jpg" alt="ফিতা দিয়ে মাপার নিয়ম">
<div style="text-align:center;padding:10px;font-weight:800">ফিতা দিয়ে মাপার নিয়ম - How to Measure with Tape</div>
<div style="display:flex;gap:8px;justify-content:center;padding:0 12px 14px;flex-wrap:wrap">
<span style="background:#dbeafe;padding:6px 12px;border-radius:20px;font-size:12px">Step 1: Measure Length</span>
<span style="background:#dcfce7;padding:6px 12px;border-radius:20px;font-size:12px">Step 2: Measure Girth</span>
</div>
</div>
<div class="box">
<h2 id="mt" style="margin:0 0 14px">⚖️ ওজন ক্যালকুলেটর / Weight Calculator</h2>
<label>🌐 ভাষা / Language</label>
<select id="lang" onchange="changeLang()">
<option value="bn">বাংলা</option>
<option value="en">English</option>
</select>
<label id="lb1">📏 দৈর্ঘ্য (L) - ইঞ্চিতে লিখুন</label>
<input type="number" id="L" placeholder="যেমন: 51">
<label id="lb2">⭕ বুকের বেড় (G) - ইঞ্চিতে লিখুন</label>
<input type="number" id="G" placeholder="যেমন: 62">
<p id="f" style="text-align:center;color:#64748b;font-size:13px">সূত্র: (L x G x G) ÷ 660 = জীবিত ওজন (কেজি)</p>
<button onclick="calc()" id="btn">ওজন দেখুন / Calculate</button>
<div id="result"></div>
<a id="wa" class="wa" href="https://wa.me/8801773688915">📲 WhatsApp এ রেজাল্ট পাঠান</a>
</div>
<div class="footer">
<p>© 2026 Pashu Eta - প্রোমো ক্যালকুলেটর</p>
</div>
<script>
const T={
bn:{lb1:"📏 দৈর্ঘ্য (L) - ইঞ্চিতে লিখুন",lb2:"⭕ বুকের বেড় (G) - ইঞ্চিতে লিখুন",f:"সূত্র: (L x G x G) ÷ 660 = জীবিত ওজন (কেজি)",b:"ওজন দেখুন / Calculate",w:"📲 WhatsApp এ রেজাল্ট পাঠান",mt:"⚖️ ওজন ক্যালকুলেটর / Weight Calculator",p1:"যেমন: 51",p2:"যেমন: 62"},
en:{lb1:"📏 Length (L) - in inch",lb2:"⭕ Heart Girth (G) - in inch",f:"Formula: (L x G x G) ÷ 660 = Live Weight (Kg)",b:"Calculate Weight",w:"📲 Send Result on WhatsApp",mt:"⚖️ Weight Calculator",p1:"Ex: 51",p2:"Ex: 62"}
};
function changeLang(){
let l=document.getElementById("lang").value;
document.getElementById("lb1").innerText=T[l].lb1;
document.getElementById("lb2").innerText=T[l].lb2;
document.getElementById("f").innerText=T[l].f;
document.getElementById("btn").innerText=T[l].b;
document.getElementById("wa").innerText=T[l].w;
document.getElementById("mt").innerText=T[l].mt;
document.getElementById("L").placeholder=T[l].p1;
document.getElementById("G").placeholder=T[l].p2;
}
function calc(){
let L=document.getElementById("L").value;
let G=document.getElementById("G").value;
let r=document.getElementById("result");
if(!L||!G){r.style.display="block";r.innerHTML="সঠিক মাপ দিন / Enter size";return}
let w=(G*G*L)/660;
let m=w*0.55;
r.innerHTML="✅ জীবিত: "+w.toFixed(1)+" কেজি ("+(w/40).toFixed(2)+" মণ)<br>🥩 মাংস: "+m.toFixed(1)+" কেজি";
r.style.display="block";
r.scrollIntoView({behavior:"smooth",block:"center"});
}
</script>
</body>
</html>
