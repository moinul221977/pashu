<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Pashu Weight Calculator - পশু ওজন ক্যালকুলেটর</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font-family:system-ui;padding:10px}
.card{max-width:500px;margin:auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.1);padding-bottom:400px}
.top-img{width:100%;height:180px;object-fit:cover;display:block}
.content{padding:18px}
.lang{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
.lang button{padding:6px 12px;border-radius:20px;border:1px solid #15803d;background:#fff;cursor:pointer}
.lang button.active{background:#15803d;color:#fff}
h2{text-align:center;margin:10px 0}
.formula{background:#fef9c3;padding:10px;border-radius:10px;text-align:center;font-weight:bold;margin-bottom:10px}
label{font-weight:bold;display:block;margin:18px 0 8px;font-size:18px}
input{width:100%;padding:16px;border:3px solid #15803d;border-radius:12px;font-size:22px}
.btn{width:100%;background:#15803d;color:#fff;border:none;padding:16px;border-radius:12px;font-size:20px;font-weight:bold;margin-top:18px;cursor:pointer}
.result{margin-top:18px;background:#f0fdf4;border:3px solid #15803d;border-radius:12px;padding:16px;display:none;text-align:center}
.whatsapp{background:#25D366;color:#fff;border:none;padding:12px;border-radius:10px;width:100%;font-size:16px;font-weight:bold;margin-top:10px}
.ad-bottom{background:#f9fafb;border-top:1px solid #e5e7eb;padding:10px;text-align:center;margin-top:20px;font-size:12px;color:#888}
</style>
</head>
<body>
<div class="card">
<img src="cow-top.jpg" class="top-img" alt="Cow">
<div class="content">
<div class="lang"><button id="bnBtn" class="active" onclick="setLang('bn')">বাংলা</button><button id="enBtn" onclick="setLang('en')">English</button></div>
<h2 id="title">🐄 পশু ওজন ক্যালকুলেটর</h2>
<div class="formula" id="formula">সূত্র: (দৈর্ঘ্য × বেড় × বেড়) ÷ ৬৬০</div>
<label id="l1">দৈর্ঘ্য (ইঞ্চি)</label>
<input type="number" id="len" placeholder="যেমন: 70" onfocus="this.scrollIntoView({block:'center',behavior:'smooth'})">
<label id="l2">বুকের বেড় (ইঞ্চি)</label>
<input type="number" id="girth" placeholder="যেমন: 65" onfocus="this.scrollIntoView({block:'center',behavior:'smooth'})">
<button class="btn" id="calcBtn" onclick="calculate()">⚖️ হিসাব করুন</button>
<div class="result" id="resultBox"><div id="resultText"></div><button class="whatsapp" onclick="shareWA()">📲 WhatsApp এ শেয়ার করুন</button></div>

<!-- নিচের বিজ্ঞাপন - ছোট থাকবে -->
<div class="ad-bottom">
<div>বিজ্ঞাপন</div>
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXX" data-ad-slot="2222222222" data-ad-format="auto"></ins>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
<div style="margin-top:8px">আপনার খামারের বিজ্ঞাপন দিতে WhatsApp করুন</div>
</div>

</div>
</div>
<script>
let lang='bn';
const t={
bn:{title:'🐄 পশু ওজন ক্যালকুলেটর',formula:'সূত্র: (দৈর্ঘ্য × বেড় × বেড়) ÷ ৬৬০',l1:'দৈর্ঘ্য (ইঞ্চি)',l2:'বুকের বেড় (ইঞ্চি)',btn:'⚖️ হিসাব করুন',p1:'যেমন: 70',p2:'যেমন: 65',live:'জীবিত ওজন / Live Weight',meat:'মাংস',share:'📲 WhatsApp এ শেয়ার করুন',alert:'দৈর্ঘ্য ও বেড় লিখুন'},
en:{title:'🐄 Animal Weight Calculator',formula:'Formula: (Length × Girth × Girth) ÷ 660',l1:'Length (inch)',l2:'Chest Girth (inch)',btn:'⚖️ Calculate',p1:'Ex: 70',p2:'Ex: 65',live:'Live Weight',meat:'Meat',share:'📲 Share on WhatsApp',alert:'Enter Length & Girth'}
};
function setLang(l){lang=l;document.getElementById('bnBtn').classList.toggle('active',l=='bn');document.getElementById('enBtn').classList.toggle('active',l=='en');document.getElementById('title').innerText=t[l].title;document.getElementById('formula').innerText=t[l].formula;document.getElementById('l1').innerText=t[l].l1;document.getElementById('l2').innerText=t[l].l2;document.getElementById('calcBtn').innerText=t[l].btn;document.getElementById('len').placeholder=t[l].p1;document.getElementById('girth').placeholder=t[l].p2;}
function calculate(){
let L=parseFloat(document.getElementById('len').value),G=parseFloat(document.getElementById('girth').value);
if(!L||!G){alert(t[lang].alert);return;}
let kg=(L*G*G)/660,mon=kg/40,meat=kg*0.55;
document.getElementById('resultText').innerHTML=`<div style="color:#666">${t[lang].live}</div><div style="font-size:34px;font-weight:bold;color:#15803d">${kg.toFixed(1)} KG</div><div style="font-size:20px;font-weight:bold">${mon.toFixed(2)} Mon</div><div style="background:#fff;padding:10px;border-radius:8px;margin-top:10px">🥩 ${t[lang].meat}: <b>${meat.toFixed(1)} KG</b></div>`;
document.getElementById('resultBox').style.display='block';
document.getElementById('resultBox').scrollIntoView({behavior:'smooth',block:'center'});
}
function shareWA(){window.open(`https://wa.me/?text=${encodeURIComponent(document.getElementById('resultText').innerText+'\nhttps://moinul221977.github.io/pashu/')}`,'_blank');}
</script>
</body>
</html>
