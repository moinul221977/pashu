<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>পশু ওজন ক্যালকুলেটর - গরুর ওজন মাপুন</title>
<meta name="description" content="গরু, ছাগল, মহিষের জীবিত ওজন ও মাংসের ওজন হিসাব করুন। সূত্র: (দৈর্ঘ্য × বেড় × বেড়) ÷ ৬৬০">
<!-- Google AdSense - আপনার ID পেলে এখানে বসাবেন -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;font-family:system-ui;padding:10px}
.card{max-width:500px;margin:auto;background:#fff;border-radius:16px;padding:20px;padding-bottom:400px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
.ad-box{background:#f1f1f1;border:1px dashed #aaa;border-radius:10px;padding:10px;text-align:center;margin:12px 0;color:#666;font-size:13px}
label{font-weight:bold;display:block;margin:20px 0 8px;font-size:18px}
input{width:100%;padding:18px;border:3px solid #15803d;border-radius:12px;font-size:22px}
.btn{width:100%;background:#15803d;color:#fff;border:none;padding:18px;border-radius:12px;font-size:20px;font-weight:bold;margin-top:20px}
.result{margin-top:20px;background:#f0fdf4;border:3px solid #15803d;border-radius:12px;padding:18px;display:none;text-align:center}
.whatsapp{background:#25D366;color:#fff;border:none;padding:14px;border-radius:10px;width:100%;font-size:17px;font-weight:bold;margin-top:12px}
</style>
</head>
<body>
<div class="card">

<!-- উপরের বিজ্ঞাপন -->
<div class="ad-box">
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXX" data-ad-slot="1111111111" data-ad-format="auto"></ins>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
<p>বিজ্ঞাপন</p>
</div>

<h2 style="text-align:center">🐄 পশু ওজন ক্যালকুলেটর</h2>
<div style="background:#fef9c3;padding:10px;border-radius:10px;text-align:center;font-weight:bold">সূত্র: (দৈর্ঘ্য × বেড় × বেড়) ÷ ৬৬০</div>

<label>দৈর্ঘ্য (ইঞ্চি)</label>
<input type="number" id="len" placeholder="যেমন: 70" onfocus="this.scrollIntoView({block:'center'})">
<label>বুকের বেড় (ইঞ্চি)</label>
<input type="number" id="girth" placeholder="যেমন: 65" onfocus="this.scrollIntoView({block:'center'})">
<button class="btn" onclick="calculate()">⚖️ হিসাব করুন</button>

<div class="result" id="resultBox"><div id="resultText"></div>
<button class="whatsapp" onclick="shareWA()">📲 WhatsApp এ শেয়ার করুন</button>
</div>

<!-- রেজাল্টের নিচের বিজ্ঞাপন - এখানে ক্লিক বেশি হয় -->
<div class="ad-box" style="margin-top:20px">
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXX" data-ad-slot="2222222222" data-ad-format="auto"></ins>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
<p>বিজ্ঞাপন</p>
</div>

<div style="background:#eef2ff;padding:12px;border-radius:10px;margin-top:15px;font-size:14px">
📢 আপনার গো-খাদ্য / খামারের বিজ্ঞাপন এখানে দিতে চান? <br>যোগাযোগ: <b>WhatsApp</b> এ মেসেজ দিন
</div>

</div>
<script>
function calculate(){
let L=parseFloat(document.getElementById('len').value),G=parseFloat(document.getElementById('girth').value);
if(!L||!G){alert('দৈর্ঘ্য ও বেড় লিখুন');return;}
let kg=(L*G*G)/660,mon=kg/40,meat=kg*0.55;
document.getElementById('resultText').innerHTML=`<div style="color:#666">জীবিত ওজন / Live Weight</div><div style="font-size:32px;font-weight:bold;color:#15803d">${kg.toFixed(1)} কেজি</div><div style="font-size:20px;font-weight:bold">${mon.toFixed(2)} মন</div><div style="background:#fff;padding:10px;border-radius:8px;margin-top:10px">🥩 মাংস: <b>${meat.toFixed(1)} কেজি</b></div>`;
document.getElementById('resultBox').style.display='block';
document.getElementById('resultBox').scrollIntoView({behavior:'smooth'});
}
function shareWA(){window.open(`https://wa.me/?text=${encodeURIComponent('🐄 পশুর ওজন: '+document.getElementById('resultText').innerText+'\nhttps://moinul221977.github.io/pashu/')}`,'_blank');}
</script>
</body>
</html>
