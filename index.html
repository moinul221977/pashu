<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cow Calculator</title>
<style>
body{margin:0; padding:10px; background:#f2f2f2; font-family:Arial}
.box{max-width:500px; margin:auto; background:#fff; border-radius:16px; padding:16px}
.top-img{width:100%; height:220px; background:#ddd; border-radius:12px; object-fit:cover; display:block}
.btn-lang{float:right; padding:6px 14px; border:1px solid green; border-radius:20px; background:#fff; font-weight:bold}
h2{text-align:center; color:#0a8a2a; clear:both; padding-top:10px}
label{font-weight:bold; display:block; margin:12px 0 5px}
input,select{width:100%; padding:12px; border:1px solid #ccc; border-radius:8px; box-sizing:border-box}
.btn{width:100%; padding:13px; border:none; border-radius:10px; font-weight:bold; margin-top:10px; cursor:pointer}
.green{background:#0a8a2a; color:#fff}
.blue{background:#0d6efd; color:#fff}
.result{background:#e8f5e9; padding:12px; border-radius:10px; margin-top:15px; display:none}
.item{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #c8e6c9}
.ad{border:1px dashed #999; background:#f9f9f9; padding:10px; text-align:center; margin:12px 0; border-radius:8px; font-size:12px}
video{width:100%; border-radius:10px; display:none; margin-top:10px}
.wa{display:block; background:#25D366; color:#fff; text-align:center; padding:12px; border-radius:10px; text-decoration:none; margin-top:10px; font-weight:bold}
</style>
</head>
<body>
<div class="box">
<button class="btn-lang" id="langBtn" onclick="toggleLang()">English</button>
<h2 id="title">গরুর ওজন ক্যালকুলেটর</h2>

<!-- 1. সবার উপরে গরুর ছবি -->
<img id="preview" class="top-img" src="https://via.placeholder.com/500x220?text=Cow+Photo" alt="Cow">
<input type="file" accept="image/*" id="photoInput" onchange="showPhoto(event)" style="margin-top:10px">
<button class="btn blue" id="btnCam" onclick="openCamera()">📷 লাইভ ক্যামেরা</button>
<video id="video" autoplay playsinline></video>
<button class="btn" id="btnCap" style="display:none; background:#000; color:#fff" onclick="capturePhoto()">📸 ছবি তুলুন</button>
<canvas id="canvas" style="display:none"></canvas>

<div class="ad">AD TOP - AdSense এখানে</div>

<!-- 2. তার নিচে ক্যালকুলেটর -->
<label id="l_animal">পশু নির্বাচন</label>
<select id="animal">
<option value="cow">গরু</option>
<option value="goat">ছাগল / খাসি</option>
<option value="buffalo">মহিষ</option>
</select>

<label id="l_length">দৈর্ঘ্য (ইঞ্চি)</label>
<input type="number" id="length" placeholder="70">
<label id="l_girth">বুকের বেড় (ইঞ্চি)</label>
<input type="number" id="girth" placeholder="75">

<button class="btn green" id="calcBtn" onclick="calculate()">ওজন হিসাব করুন</button>

<!-- 3. সিরিয়ালে রেজাল্ট -->
<div class="result" id="resultBox">
<div class="item"><span id="r_live">জীবিত ওজন</span><b id="liveW">0 kg</b></div>
<div class="item"><span id="r_meat">মাংস (কেজি)</span><b id="meatKg">0 kg</b></div>
<div class="item"><span id="r_mon">মাংস (মন)</span><b id="meatMon">0 মন</b></div>
<a class="wa" id="waBtn" href="#" target="_blank">WhatsApp এ শেয়ার করুন</a>
</div>

<div class="ad">AD MIDDLE - AdSense এখানে</div>
<div class="ad">AD BOTTOM - AdSense এখানে</div>
<p style="text-align:center; font-size:12px; color:#666" id="formula">ফর্মুলা: (বেড়² × দৈর্ঘ্য) ÷ ৬৬০</p>
</div>

<script>
let isBn = true;
function toggleLang(){
 isBn = !isBn;
 if(isBn){
  document.getElementById('title').innerText='গরুর ওজন ক্যালকুলেটর';
  document.getElementById('l_animal').innerText='পশু নির্বাচন';
  document.getElementById('l_length').innerText='দৈর্ঘ্য (ইঞ্চি)';
  document.getElementById('l_girth').innerText='বুকের বেড় (ইঞ্চি)';
  document.getElementById('calcBtn').innerText='ওজন হিসাব করুন';
  document.getElementById('r_live').innerText='জীবিত ওজন';
  document.getElementById('r_meat').innerText='মাংস (কেজি)';
  document.getElementById('r_mon').innerText='মাংস (মন)';
  document.getElementById('btnCam').innerText='📷 লাইভ ক্যামেরা';
  document.getElementById('btnCap').innerText='📸 ছবি তুলুন';
  document.getElementById('langBtn').innerText='English';
  document.getElementById('waBtn').innerText='WhatsApp এ শেয়ার করুন';
  document.getElementById('formula').innerText='ফর্মুলা: (বেড়² × দৈর্ঘ্য) ÷ ৬৬০';
 } else {
  document.getElementById('title').innerText='Live Weight Calculator';
  document.getElementById('l_animal').innerText='Select Animal';
  document.getElementById('l_length').innerText='Length (inch)';
  document.getElementById('l_girth').innerText='Chest Girth (inch)';
  document.getElementById('calcBtn').innerText='Calculate Weight';
  document.getElementById('r_live').innerText='Live Weight';
  document.getElementById('r_meat').innerText='Meat (KG)';
  document.getElementById('r_mon').innerText='Meat (Maund)';
  document.getElementById('btnCam').innerText='📷 Live Camera';
  document.getElementById('btnCap').innerText='📸 Capture';
  document.getElementById('langBtn').innerText='বাংলা';
  document.getElementById('waBtn').innerText='Share on WhatsApp';
  document.getElementById('formula').innerText='Formula: (Girth² × Length) ÷ 660';
 }
}
function showPhoto(e){
 let file=e.target.files[0];
 if(file){
  let url=URL.createObjectURL(file);
  document.getElementById('preview').src=url;
 }
}
let stream;
async function openCamera(){
 let video=document.getElementById('video');
 video.style.display='block';
 document.getElementById('btnCap').style.display='block';
 stream=await navigator.mediaDevices.getUserMedia({video:true});
 video.srcObject=stream;
}
function capturePhoto(){
 let video=document.getElementById('video');
 let canvas=document.getElementById('canvas');
 canvas.width=video.videoWidth; canvas.height=video.videoHeight;
 canvas.getContext('2d').drawImage(video,0,0);
 document.getElementById('preview').src=canvas.toDataURL('image/jpeg');
 video.style.display='none';
 document.getElementById('btnCap').style.display='none';
 stream.getTracks().forEach(t=>t.stop());
}
function calculate(){
 let L=parseFloat(document.getElementById('length').value);
 let G=parseFloat(document.getElementById('girth').value);
 if(!L||!G){ alert(isBn?'মান লিখুন':'Enter values'); return;}
 let live=(G*G*L)/660;
 let perc=document.getElementById('animal').value==='goat'?0.50:0.55;
 let meat=live*perc;
 let mon=meat/40;
 document.getElementById('liveW').innerText=live.toFixed(2)+' kg';
 document.getElementById('meatKg').innerText=meat.toFixed(2)+' kg';
 document.getElementById('meatMon').innerText=mon.toFixed(2)+(isBn?' মন':' Mon');
 document.getElementById('resultBox').style.display='block';
 let txt=`Live:${live.toFixed(1)}kg Meat:${meat.toFixed(1)}kg (${mon.toFixed(2)} Mon)`;
 document.getElementById('waBtn').href='https://wa.me/?text='+encodeURIComponent(txt);
}
</script>
</body>
</html>
