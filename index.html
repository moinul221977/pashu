<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pashu Eta</title>
<style>
body{margin:0;padding:0;background:#f1f5f9;font-family:system-ui;padding-bottom:450px}
.header{max-width:520px;margin:auto;background:#fff;text-align:center;padding:16px}
.header h1{color:#15803d;margin:0;font-size:26px}
.cow-card{max-width:520px;margin:10px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px #0001}
.cow-card img{width:100%;display:block}
.box{max-width:520px;margin:12px auto;background:#fff;border-radius:16px;padding:18px}
label{font-weight:600;display:block;margin-bottom:6px}
input,select{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:18px;box-sizing:border-box;margin-bottom:14px}
button{width:100%;padding:14px;background:#16a34a;color:#fff;border:0;border-radius:10px;font-size:18px;font-weight:bold}
#result{margin-top:16px;padding:14px;background:#dcfce7;border-radius:10px;display:none;font-weight:bold;font-size:19px}
</style>
</head>
<body>
<div class="header"><h1>🐄 পশুর হাট - লাইভ<br>গরুর বাজার</h1></div>
<div class="cow-card">
<img src="fita_final.jpg" alt="ফিতা দিয়ে মাপার নিয়ম">
<p style="text-align:center;font-weight:600;padding:10px;margin:0">ফিতা দিয়ে গরুর ওজন মাপুন</p>
</div>
<div class="box">
<h2 id="mainTitle">⚖️ ওজন ক্যালকুলেটর / Weight Calculator</h2>
<label>🌐 ভাষা / Language</label>
<select id="lang" onchange="changeLang()"><option value="bn">বাংলা</option><option value="en">English</option></select>
<label id="lb1">📏 দৈর্ঘ্য (L) - ইঞ্চিতে লিখুন</label>
<input type="number" id="L" placeholder="যেমন: 51">
<label id="lb2">⭕ বুকের বেড় (G) - ইঞ্চিতে লিখুন</label>
<input type="number" id="G" placeholder="যেমন: 62">
<p id="formula" style="text-align:center;color:#666;font-size:13px">সূত্র: (L x G x G) ÷ 660 = জীবিত ওজন (কেজি)</p>
<button onclick="calc()" id="calcBtn">ওজন দেখুন / Calculate</button>
<div id="result"></div>
</div>
<script>
const t={bn:{lb1:"📏 দৈর্ঘ্য (L) - ইঞ্চিতে লিখুন",lb2:"⭕ বুকের বেড় (G) - ইঞ্চিতে লিখুন",f:"সূত্র: (L x G x G) ÷ 660 = জীবিত ওজন (কেজি)",b:"ওজন দেখুন / Calculate",mt:"⚖️ ওজন ক্যালকুলেটর / Weight Calculator",ph1:"যেমন: 51",ph2:"যেমন: 62"},en:{lb1:"📏 Length (L) - in inch",lb2:"⭕ Heart Girth (G) - in inch",f:"Formula: (L x G x G) ÷ 660 = Live Weight (Kg)",b:"Calculate",mt:"⚖️ Weight Calculator / ওজন ক্যালকুলেটর",ph1:"Ex: 51",ph2:"Ex: 62"}};
function changeLang(){let l=document.getElementById("lang").value;document.getElementById("lb1").innerText=t[l].lb1;document.getElementById("lb2").innerText=t[l].lb2;document.getElementById("formula").innerText=t[l].f;document.getElementById("calcBtn").innerText=t[l].b;document.getElementById("mainTitle").innerText=t[l].mt;document.getElementById("L").placeholder=t[l].ph1;document.getElementById("G").placeholder=t[l].ph2;}
function calc(){let L=document.getElementById("L").value,G=document.getElementById("G").value,r=document.getElementById("result");if(!L||!G){r.style.display="block";r.innerHTML="সঠিক মাপ দিন";return}let w=(G*G*L)/660,m=w*0.55;r.innerHTML="✅ জীবিত: "+w.toFixed(1)+" কেজি ("+(w/40).toFixed(2)+" মণ)<br>🥩 মাংস: "+m.toFixed(1)+" কেজি";r.style.display="block";r.style.marginBottom="30px";setTimeout(()=>{r.scrollIntoView({behavior:"smooth",block:"center"})},150);document.activeElement.blur();}
</script>
</body>
</html>
