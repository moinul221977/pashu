<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pashu Eta</title>
<style>
body{margin:0;background:#f2f7f2;font-family:Arial}
.box{max-width:520px;margin:auto;background:#fff;position:relative}
.top-img{width:100%;display:block}
.content{padding:14px}
.btn-lang{position:absolute;top:10px;right:10px;padding:6px 14px;border-radius:20px;border:1px solid #0a8a2a;background:#fff;font-weight:bold}
h2{text-align:center;color:#0a8a2a}
label{font-weight:bold;display:block;margin:12px 0 5px}
input,select{width:100%;padding:13px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box;font-size:16px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;margin-top:12px;font-size:17px}
.green{background:#0a8a2a;color:#fff}
.result{background:#e8f5e9;padding:14px;border-radius:12px;margin-top:14px;display:none}
.item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #c8e6c9}
.ad{background:#f0f0f0;border:1px dashed #999;padding:10px;text-align:center;margin:12px 0;border-radius:8px;font-size:12px}
.wa{display:block;background:#25D366;color:#fff;text-align:center;padding:13px;border-radius:10px;text-decoration:none;margin-top:12px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<button class="btn-lang" id="langBtn" onclick="toggleLang()">English</button>
<img class="top-img" src="https://i.ibb.co/8g0tL0dV/cow-guide.jpg" alt="cow">
<div class="content">
<h2 id="title">গরুর ওজন ক্যালকুলেটর</h2>
<div class="ad">AD TOP - এখানে AdSense কোড বসাবেন</div>

<label id="l_animal">পশু নির্বাচন</label>
<select id="animal"><option value="cow">গরু</option><option value="goat">ছাগল</option><option value="buffalo">মহিষ</option></select>

<label id="l_length">দৈর্ঘ্য (ইঞ্চি) - B</label>
<input type="number" id="len" placeholder="70">

<label id="l_girth">বুকের বেড় (ইঞ্চি) - C</label>
<input type="number" id="gir" placeholder="75">

<button class="btn green" id="calcBtn" onclick="calc()">ওজন হিসাব করুন</button>

<div class="result" id="resBox">
<div class="item"><span id="r_live">জীবিত ওজন</span><b id="liveW"></b></div>
<div class="item"><span id="r_meat">মাংস কেজি</span><b id="meatKg"></b></div>
<div class="item"><span id="r_mon">মাংস মন</span><b id="meatMon"></b></div>
<a class="wa" id="waBtn" href="#" target="_blank">WhatsApp এ শেয়ার</a>
</div>

<div class="ad">AD MIDDLE</div>
<div class="ad">AD BOTTOM</div>
<p style="text-align:center;font-size:11px;color:#666">উপরের ছবি দেখে B আর C মাপুন</p>
</div>
</div>

<script>
let isBn=true;
function toggleLang(){
 isBn=!isBn;
 if(isBn){
  title.innerText='গরুর ওজন ক্যালকুলেটর';
  l_animal.innerText='পশু নির্বাচন';
  l_length.innerText='দৈর্ঘ্য (ইঞ্চি) - B';
  l_girth.innerText='বুকের বেড় (ইঞ্চি) - C';
  calcBtn.innerText='ওজন হিসাব করুন';
  r_live.innerText='জীবিত ওজন';
  r_meat.innerText='মাংস কেজি';
  r_mon.innerText='মাংস মন';
  langBtn.innerText='English';
  waBtn.innerText='WhatsApp এ শেয়ার';
 }else{
  title.innerText='Cow Weight Calculator';
  l_animal.innerText='Select Animal';
  l_length.innerText='Length (inch) - B';
  l_girth.innerText='Girth (inch) - C';
  calcBtn.innerText='Calculate Weight';
  r_live.innerText='Live Weight';
  r_meat.innerText='Meat KG';
  r_mon.innerText='Meat Maund';
  langBtn.innerText='বাংলা';
  waBtn.innerText='Share on WhatsApp';
 }
}
function calc(){
 let L=parseFloat(len.value);
 let G=parseFloat(gir.value);
 if(!L||!G){alert(isBn?'মান লিখুন':'Enter values');return;}
 let live=(G*G*L)/660;
 let perc=animal.value==='goat'?0.5:0.55;
 let meat=live*perc;
 let mon=meat/40;
 liveW.innerText=live.toFixed(2)+' kg';
 meatKg.innerText=meat.toFixed(2)+' kg';
 meatMon.innerText=mon.toFixed(2)+(isBn?' মন':' Mon');
 resBox.style.display='block';
 let txt=`Live ${live.toFixed(1)}kg, Meat ${meat.toFixed(1)}kg`;
 waBtn.href='https://wa.me/?text='+encodeURIComponent(txt);
}
</script>
</body>
</html>
