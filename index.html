
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pashu Calculator</title><style>body{font-family:Arial;background:#f0fdf4;margin:0;padding:10px}.box{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:12px}h1{text-align:center;color:#15803d}input{width:100%;padding:12px;margin-top:8px;border:1px solid #ccc;border-radius:8px}button{width:100%;padding:14px;background:#16a34a;color:#fff;border:none;border-radius:10px;font-size:18px;margin-top:12px}.r{margin-top:12px;padding:15px;background:#dcfce7;border-radius:10px;text-align:center;display:none}.f{text-align:center;padding:15px}.f a{margin:0 6px;color:#15803d;text-decoration:none;font-weight:bold}</style></head><body><div class="box"><h1>🐄 Pashu Calculator</h1><p>Length inch</p><input id="L" type="number"><p>Girth inch</p><input id="G" type="number"><button onclick="let L=document.getElementById('L').value,G=document.getElementById('G').value,w=(G*G*L)/660,m=w*0.55,d=document.getElementById('r');d.style.display='block';d.innerHTML='Live: '+w.toFixed(2)+' KG<br>Meat: '+m.toFixed(2)+' KG'">Calculate</button><div id="r" class="r"></div></div><div class="f"><a href="about.html">About</a>|<a href="contact.html">Contact</a>|<a href="privacy-policy.html">Privacy</a><p>©2026</p></div></body></html>
